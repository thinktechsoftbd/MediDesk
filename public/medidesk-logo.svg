<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="260" viewBox="0 0 1010 260">
  <title>MediDesk - A Software For Health</title>
  <defs>
    <!-- soft teal: the app's teal-600 to teal-700, lightened as at 80% on white -->
    <linearGradient id="markTeal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3DA9A0"/>
      <stop offset="1" stop-color="#3F918B"/>
    </linearGradient>
  </defs>
  <!-- the T mark, drawn on a 1024 grid -->
  <g transform="translate(6 6) scale(0.24)">
    <rect x="80" y="144" width="800" height="800" rx="190" fill="url(#markTeal)"/>
    <rect x="224" y="336" width="512" height="112" rx="22" fill="#fff"/>
    <rect x="424" y="420" width="112" height="364" rx="22" fill="#fff"/>
    <circle cx="864" cy="160" r="96" fill="#EE793D"/>
  </g>
  <!-- textLength: the same width whichever font the viewer has -->
  <text x="268" y="160" textLength="712" lengthAdjust="spacingAndGlyphs" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="132" font-weight="900" fill="#3F918B">MEDI<tspan fill="#EE793D">DESK</tspan></text>
  <text x="272" y="216" textLength="440" lengthAdjust="spacingAndGlyphs" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="40" font-weight="600" fill="#EE793D">A Software For Health</text>
</svg>
